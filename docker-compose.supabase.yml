# Local Supabase-shaped verification stack.
#
#   docker compose -f docker-compose.supabase.yml up -d
#
# Deliberately separate from docker-compose.yml so the normal dev path is untouched.
# Ports: 5433 direct (TLS required), 6543 transaction pooler (TLS on both legs).
#
# Mirrors a hosted project's role set, `extensions` schema, search_path, TLS
# enforcement and RLS-role split. It is NOT a hosted Supabase project: Supavisor,
# the dashboard, Auth/Storage APIs and backups do not exist here.
name: roadguard-supabase

services:
  supabase-db:
    image: postgis/postgis:16-3.4
    container_name: roadguard-supabase-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
      - ./infrastructure/supabase/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 5s
      retries: 30

  # One-shot: writes the pooler's client-facing certificate into a named volume so
  # no host path translation is involved (works identically on Windows and Linux).
  certs:
    image: postgis/postgis:16-3.4
    container_name: roadguard-supabase-certs
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        openssl req -x509 -newkey rsa:2048 -nodes -days 365
        -keyout /certs/pooler.key -out /certs/pooler.crt
        -subj "/CN=roadguard-local-pooler" >/dev/null 2>&1 &&
        chmod 644 /certs/pooler.key /certs/pooler.crt &&
        echo "pooler certificate written"
    volumes:
      - pooler-certs:/certs

  # One-shot: writes the pooler's auth file from APP_DB_PASSWORD into a named volume.
  # Doing this in a volume (not a host bind mount) avoids Docker Desktop serving a
  # stale copy of a file rewritten moments earlier, and keeps the password out of git.
  auth:
    image: postgis/postgis:16-3.4
    container_name: roadguard-supabase-auth
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        printf '"roadguard_app" "%s"\n' "$APP_DB_PASSWORD" > /auth/userlist.txt &&
        chmod 644 /auth/userlist.txt && echo "pooler auth file written"
    environment:
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD (scripts/verify_supabase_coldstart.sh generates it)}
    volumes:
      - pooler-auth:/auth

  pooler:
    image: edoburu/pgbouncer:v1.23.1-p2
    container_name: roadguard-supabase-pooler
    depends_on:
      supabase-db:
        condition: service_healthy
      certs:
        condition: service_completed_successfully
      auth:
        condition: service_completed_successfully
    volumes:
      - ./infrastructure/supabase/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - pooler-auth:/etc/pgbouncer/auth:ro
      - pooler-certs:/etc/pgbouncer/certs:ro
    ports:
      - "6543:6543"
    # No in-image healthcheck: the image is minimal. Readiness is proven from the
    # host by an actual TLS connection (see docs/SUPABASE.md).

volumes:
  supabase-db-data:
  pooler-certs:
  pooler-auth:
