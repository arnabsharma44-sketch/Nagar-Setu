; Transaction-mode pooler that mimics Supabase's port 6543 endpoint.
;
; The important property is pool_mode = transaction: server-side named prepared
; statements cannot survive between transactions, which is exactly why the API
; disables psycopg's automatic preparation when it detects a pooler URL.
[databases]
postgres = host=supabase-db port=5432 dbname=postgres

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6543
auth_type = plain
auth_file = /etc/pgbouncer/auth/userlist.txt
pool_mode = transaction
max_client_conn = 200
default_pool_size = 20
server_reset_query = DISCARD ALL

; Client leg: the app must negotiate TLS with the pooler, as it must with Supabase.
client_tls_sslmode = require
client_tls_cert_file = /etc/pgbouncer/certs/pooler.crt
client_tls_key_file = /etc/pgbouncer/certs/pooler.key

; Server leg: the database only accepts hostssl connections.
server_tls_sslmode = require

ignore_startup_parameters = extra_float_digits,search_path
